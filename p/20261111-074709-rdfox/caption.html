<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<body style="font:18px -apple-system;padding:20px;background:#fff">
<button id="b" style="display:block;width:100%;padding:24px;font-size:22px;background:#0a8935;color:#fff;border:0;border-radius:12px">Скопировать подпись</button>
<textarea id="t" style="width:100%;height:60vh;margin-top:16px;font-size:16px">Threads набрал 100 миллионов регистраций за 5 дней. А через месяц из 44 миллионов человек, которые заходили каждый день, осталось 8.

За 12 лет до этого Google сделал тот же ход с Google+ и закрыл его. Threads выжил. Разбираю, почему так вышло и что из этого взять, если у тебя нет своего Instagram, чтобы перелить туда людей.

Рекорд по скорости ставит тот, у кого уже есть толпа. Выживает тот, к кому возвращаются.

А ты в своем продукте считаешь регистрации или тех, кто вернулся?</textarea>
<script>b.onclick=async()=>{try{await navigator.clipboard.writeText(t.value);b.textContent="Скопировано"}catch(e){t.select();document.execCommand("copy");b.textContent="Скопировано"}}</script>
</body>
